name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            binary: rmrb-downloader
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            binary: rmrb-downloader
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            binary: rmrb-downloader
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: rmrb-downloader.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: rmrb-downloader.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          staging="rmrb-downloader-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp config.toml "$staging/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Package release (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "rmrb-downloader-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $staging
          Copy-Item config.toml $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: rmrb-downloader-${{ matrix.target }}.${{ matrix.archive }}
          fail_on_unmatched_files: true
