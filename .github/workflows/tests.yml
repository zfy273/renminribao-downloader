name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        # ubuntu-24.04（ubuntu-latest）没有 3.9 的预装包，setup-python 会失败，
        # 挪到 22.04 上跑；Windows 的 3.9 正常。
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m py_compile rmrb_core.py rmrb_pdf.py rmrb_downloader.py rmrb_ui.py

      - name: 单元测试（完全离线，不访问网络）
        run: python -m unittest discover -s tests -v

      - name: 命令行冒烟
        run: python rmrb_downloader.py --help
