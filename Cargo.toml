[package]
name = "renminribao-downloader"
version = "2.1.0"
edition = "2024"
description = "人民日报电子版下载器"
license = "MIT"

[[bin]]
name = "rmrb-downloader"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
lopdf = "0.39"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tempfile = "3.15"
